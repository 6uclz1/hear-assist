# via https://github.com/peaceiris/actions-gh-pages
name: GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:

# 既定では権限を与えず、必要なジョブだけに最小限の権限を付与する。
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # npm の依存コードはこのジョブでだけ実行し、書き込み権限のあるトークンには触れさせない。
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # 依存のキャッシュ汚染を避けるため、キャッシュは使わない。
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Download ReazonSpeech model
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --output /tmp/reazonspeech.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-zipformer-ja-reazonspeech-2024-08-01.tar.bz2
          echo "${REAZONSPEECH_ARCHIVE_SHA256}  /tmp/reazonspeech.tar.bz2" | sha256sum --check --strict
          model_name=sherpa-onnx-zipformer-ja-reazonspeech-2024-08-01
          model_dir=/tmp/$model_name
          tar --no-same-owner -xjf /tmp/reazonspeech.tar.bz2 -C /tmp \
            "$model_name/tokens.txt" \
            "$model_name/encoder-epoch-99-avg-1.int8.onnx" \
            "$model_name/decoder-epoch-99-avg-1.onnx" \
            "$model_name/joiner-epoch-99-avg-1.int8.onnx"
          mkdir -p dist/models/reazonspeech
          cp "$model_dir/tokens.txt" dist/models/reazonspeech/
          cp "$model_dir/decoder-epoch-99-avg-1.onnx" dist/models/reazonspeech/
          cp "$model_dir/joiner-epoch-99-avg-1.int8.onnx" dist/models/reazonspeech/
          split --bytes=75MiB --numeric-suffixes=0 --suffix-length=2 \
            "$model_dir/encoder-epoch-99-avg-1.int8.onnx" \
            dist/models/reazonspeech/encoder-epoch-99-avg-1.int8.onnx.part-
        env:
          REAZONSPEECH_ARCHIVE_SHA256: e0981d0d5d7b446d41010831b59091ebf57d2aa7b79980f67ca37af460b5842d

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          enable-cache: false

      - name: Download Haas model
        run: scripts/haas/download.sh dist/models/haas

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
